[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swingrank"
version = "0.1.0"
description = "Point-in-time-safe, explainable U.S. equity screening and ranking engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Stock-Trader project" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "tzdata>=2024.1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
dayrank = "dayrank.cli:main"
swingrank = "swingrank.cli:main"
swingrank-adaptive = "swingrank.adaptive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "RUF"]
